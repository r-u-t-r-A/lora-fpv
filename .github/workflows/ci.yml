name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build ffmpeg
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DOLV_SANITIZE=ON
      - name: Build
        run: ninja -C build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Target build with the luckfox-pico SDK toolchain (GCC 8.3, uClibc,
  # Linux 5.10 headers), unit tests run on ARM under qemu-user.
  rv1103:
    runs-on: ubuntu-24.04
    env:
      TC: luckfox-sdk/tools/linux/toolchain/arm-rockchip830-linux-uclibcgnueabihf
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/cache@v4
        id: sdk
        with:
          path: luckfox-sdk
          key: luckfox-toolchain-v2
      - name: Fetch the SDK toolchain and camera libraries only (sparse checkout)
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/LuckfoxTECH/luckfox-pico.git luckfox-sdk
          aiq=media/isp/release_camera_engine_rkaiq_rv1106_arm-rockchip830-linux-uclibcgnueabihf
          git -C luckfox-sdk sparse-checkout set --no-cone \
            /tools/linux/toolchain/arm-rockchip830-linux-uclibcgnueabihf/ \
            /media/rockit/rockit/mpi/sdk/include/ /media/rockit/rockit/lib/lib32/librockit.so \
            /$aiq/include/ /$aiq/lib/librkaiq.so
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build qemu-user
      - name: Configure
        run: >
          cmake -S . -B build-rv1103 -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/luckfox-rv1103.cmake -DLUCKFOX_SDK=$PWD/luckfox-sdk
          "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-arm;-L;$PWD/$TC/arm-rockchip830-linux-uclibcgnueabihf/sysroot"
      - name: Build
        run: ninja -C build-rv1103 && test -x build-rv1103/air/olv-cam
      - name: Unit tests (ARM, qemu-user)
        run: ctest --test-dir build-rv1103 --output-on-failure -E "^m[12]_"

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build ffmpeg
      - name: Simulator capture for the WASM test
        run: |
          cmake -S . -B build -G Ninja -DOLV_RADIO=OFF
          ninja -C build loopback
          ./build/sim/loopback --seconds 4 --out build/cap
      - name: Build WASM
        working-directory: web
        run: npm ci && npm run wasm
      - name: Typecheck, test, build
        working-directory: web
        env:
          OLV_VRXLOG: ${{ github.workspace }}/build/cap
        run: npm run typecheck && npm test && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
