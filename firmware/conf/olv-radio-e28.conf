# /etc/olv-radio.conf: Ebyte E28-2G4M27S (SX1280) on a Luckfox Pico Mini.
# Proposed wiring (docs/wiring.md); change the numbers if you wire differently.
# GPIO number = bank * 32 + group * 8 + n (A=0 B=1 C=2 D=3).
module=e28-2g4m27s     # chip=sx1280, TXEN/RXEN table, PA 25 dB, LNA 12 dB, max -1 dBm
spidev=/dev/spidev0.0  # SPI0_M0: CS0 GPIO1_C0, CLK C1, MOSI C2, MISO C3
spi_hz=8000000
busy=54                # GPIO1_C6
irq=59                 # GPIO1_D3 <- E28 DIO1
nreset=58              # GPIO1_D2
rf_pins=53,52          # TXEN GPIO1_C5, RXEN GPIO1_C4 (in this order)
power_dbm=-18          # chip output; ~+7 dBm at the antenna port. >0 needs air --outdoor
