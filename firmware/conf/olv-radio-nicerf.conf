# /etc/olv-radio.conf: NiceRF LoRa2021F33-2G4 (LR2021) on a Luckfox Pico Mini.
# Proposed wiring (docs/wiring.md); the PA/LNA enables and their levels per
# mode still have to come from the NiceRF datasheet (rf_pins, rf_table).
chip=lr2021
spidev=/dev/spidev0.0  # SPI0_M0: CS0 GPIO1_C0, CLK C1, MOSI C2, MISO C3
spi_hz=8000000
busy=54                # GPIO1_C6
irq=59                 # GPIO1_D3 <- LR2021 DIO5
nreset=58              # GPIO1_D2
rf_pins=               # e.g. 53,52 (GPIO1_C5, GPIO1_C4), per the NiceRF datasheet
rf_table=              # stby,rx,tx,rx_hf,tx_hf bitmasks
tcxo_mv=0
power_dbm=-9
